name: base
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.4
  # --- Serialization-critical: pin to match JupyterLab ---
  - numpy=1.26.4
  - pandas=2.3.2
  - zarr=2.18.7
  - cloudpickle=2.2.1
  # --- Core compute ---
  - dask=2023.8.0
  - distributed=2023.8.0
  - lz4=4.3.2
  - tornado=6.3.2
  # --- C-extension packages (prefer conda for ABI safety) ---
  - eccodes=2.38.0
  - python-eccodes
  - cfgrib>=0.9.14
  - h5netcdf>=1.7.3
  - netcdf4>=1.6.0
  - aiohttp>=3.13.3
  - psutil>=7.1.1
  - pyyaml>=6.0.3
  - scipy>=1.15.3
  - pykdtree>=1.3.7
  # --- Geo stack ---
  - pyresample
  - pyproj>=3.0.0
  - geopandas>=1.1.2
  - rioxarray
  - datacube
  - cf-units
  # --- Other conda packages ---
  - astropy>=6.1.7
  - astropy-healpix>=1.1.2
  - cf-xarray>=0.9.0
  - loguru>=0.7.3
  - pydantic>=2.12.3
  - typing-extensions>=4.15.0
  - pip
  - pip:
      # --- Packages upgraded beyond DestinE defaults ---
      - "xarray>=2025.9.0"
      - "fsspec>=2025.9.0"
      - "s3fs>=2025.9.0"
      - "boto3>=1.34.0"
      - "urllib3>=2.6.3"
      - "bokeh>=3.8.2"
      - "dask-gateway>=2023.1.1"
      - "h5py>=3.15.1"
      - "earthkit-data>=0.17.0"
      - "pystac>=1.14.3"
      # --- DEFAIR dependencies not in conda ---
      - "typer>=0.19.2"
      - "gribscan>=0.0.14"
      - "python-dotenv>=1.2.1"
      - "destine-auth>=0.1"
      - "xarray-regrid>=0.4.1"
      # --- Existing pip packages ---
      - pystac_client
      - rich
      - odc-stac
      - eodag==3.8.1
      - eodag-cube==0.6.0
      - dedl-stack-client==2025.5.1
      - destinelab==1.13
      - polytope-python
      - earthkit-meteo
      - earthkit-regrid
